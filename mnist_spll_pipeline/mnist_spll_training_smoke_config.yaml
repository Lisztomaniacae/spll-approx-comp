extends: mnist_spll_training_config.yaml

paths:
  output_root: ./outputs/spll_training_smoke

seeds: [42]

adaptive_top_k:
  posterior_mass_target: 0.8
  probe_cases: 5
  max_iterations: 8
  tolerance: 0.05
  min_cutoff: 0.0
  max_cutoff: 1.0

training:
  sum_batch_size: 50
  max_steps: 500

validation:
  interval_steps: 50
  milestones: [0.1, 0.2]
  sum_posterior:
    num_cases: 20
    zero_total_mass_tolerance: 1.0e-12

schedule:
  preview_size: 20

experiments:
  - n_terms: 2
    enabled: true
    max_steps: 500

inference_modes:
  - name: exact
    top_k_cutoff: null
  - name: approx_mass_0p8
    top_k_cutoff: auto
    adaptive_top_k: true
    posterior_mass_target: 0.8
  - name: approx_0p01
    top_k_cutoff: 0.01
