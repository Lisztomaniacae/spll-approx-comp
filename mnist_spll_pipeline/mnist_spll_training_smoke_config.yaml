extends: mnist_spll_training_config.yaml

paths:
  output_root: ./outputs/spll_training_smoke

seeds: [42]

checkpointing:
  enabled: true
  metric: true_sum_posterior
  posterior_thresholds: [0.1, 0.2]
  rolling_window_updates: 50
  rolling_window_policy: full

training:
  sum_batch_size: 1
  max_steps: 100

schedule:
  preview_size: 20

experiments:
  - n_terms: 2
    enabled: true
    max_steps: 100

inference_modes:
  - name: exact
    top_k_cutoff: null
  - name: approx_0p01
    top_k_cutoff: 0.01
