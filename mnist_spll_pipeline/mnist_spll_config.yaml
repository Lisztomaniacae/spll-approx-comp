seed: 42

paths:
  data_root: ./data
  outputs_root: ./outputs
  repo_root: ../haskell-dppl-main
  models_root: ./outputs/models
  model_selection_manifest: ./outputs/models/model_selection_manifest.json
  split_manifest: ./outputs/models/mnist_splits.pt
  training_root: ./outputs/training
  used_config_copy: ./outputs/config_used.yaml

training:
  device: auto
  require_mps: true
  train_ratio: 0.5
  test_ratio: 0.4
  inference_ratio: 0.1
  batch_size: 128
  eval_batch_size: 128
  num_workers: 0
  epochs: 12
  learning_rate: 0.001
  weight_decay: 0.0
  selection_mode: nearest
  target_tolerance: 0.03
  normalize:
    mean: 0.1307
    std: 0.3081

  # Base defaults inherited by each model variant unless overridden below.
  model:
    input_channels: 1
    num_classes: 10
    conv_channels: [32, 64]
    kernel_size: 3
    pool_kernel: 2
    fc_hidden: 128
    dropout: 0.25

  # Each variant is trained once. The exported checkpoint is the batch-level
  # validation point whose accuracy is closest to target_accuracy. Running the
  # validation suite after every optimizer step makes low/mid/high target models
  # much easier to hit without extra skewed-data model variants.
  validation_interval_batches: 1
  model_variants:
    - id: acc50
      target_accuracy: 0.50
      max_train_examples: 20000
      epochs: 15
      target_tolerance: 0.005
      model:
        conv_channels: []
        fc_hidden: 4

    - id: acc70
      target_accuracy: 0.70
      max_train_examples: 9000
      target_tolerance: 0.005
      epochs: 15
      model:
        conv_channels: []
        fc_hidden: 8

    - id: acc90
      target_accuracy: 0.90
      epochs: 15
      target_tolerance: 0.005
      max_train_examples: 12000
      model:
        conv_channels: []
        fc_hidden: 12
        dropout: 0.1

inference:
  device: auto
  num_experiments: 3000
  terms_per_sum_min: 2
  terms_per_sum_max: 4
  sample_without_replacement_within_experiment: true
  top_predictions_to_store: 5
  # In this repo, -k/--topKCutoff is a probability cutoff in [0, 1], not a literal class count.
  # Use null for exact inference (no pruning). Numeric values are fixed cutoffs.
  # Mapping entries can tune TOP_K_CUTOFF at runtime to capture a target posterior mass.
  adaptive_top_k:
    posterior_mass_target: 0.8
    probe_experiments: 20
    max_iterations: 14
    tolerance: 0.01
    min_cutoff: 0.0
    max_cutoff: 0.5
  approximation_thresholds:
    - null
    - 0.00
    - 0.01
    - 0.05
    - 0.1
    - 0.25
    - name: approx_mass_0p8
      top_k_cutoff: auto
      adaptive_top_k: true
      posterior_mass_target: 0.8
  # The pipeline uses the accumulated global path-mass cutoff.
  # `null` is the exact baseline (no pruning); all positive values below are global-cutoff runs.
  cutoff_modes:
  # Compile with SPLL's -c/--countBranches so each posterior query also returns a branch count.
  count_branches: false
  force_recompile: true
  compile_timeout_sec: 3600
  stack_arch: x86_64
  show_progress: true
  show_inner_progress: false
  # readMNist cache policy during timed generated-SPLL inference:
  # - uncached: default thesis timing policy; every generated-SPLL readMNist call runs the MNIST model
  # - run_scoped_no_cross_run_cache: fresh cache per measured posterior/true-candidate query
  # - precomputed_per_measurement: fresh per-measurement lookup-only neural outputs; precompute time is logged separately
  read_mnist_cache_policy: precomputed_per_measurement
  # Optional diagnostic-only untimed base readMNist calls before measured inference.
  # Keep this at 0 for thesis-facing benchmarks so cold-start effects are measured.
  read_mnist_warmup_calls: 0
