seed: 42
seeds: [42,43,44, 45, 46]
show_progress: true

paths:
  data_root: ./data
  output_root: ./outputs/spll_training
  repo_root: ../haskell-dppl-main

data:
  # Pipeline II uses only the official MNIST train partition, then creates one
  # globally materialized equal-count-per-digit 80/20 split.
  split_seed: 42
  train_fraction: 0.8
  normalize:
    mean: 0.1307
    std: 0.3081
  image_cache_device: device   # device | cpu
  image_cache_strategy: none    # none | lru
  image_cache_max_items: 4096

model:
  input_channels: 1
  num_classes: 10
  conv_channels: [32, 64]
  kernel_size: 3
  pool_kernel: 2
  fc_hidden: 128
  dropout: 0.25

optimizer:
  learning_rate: 0.001
  weight_decay: 0.0

training:
  device: auto
  require_mps: true
  # Number of SPLL sum cases accumulated into one optimizer update.
  # The redesigned benchmark uses batch=1 so one training step is one iteration.
  sum_batch_size: 1
  max_steps: 10000     # fixed training iterations / sum cases; no early stopping
  loss_epsilon: 1.0e-12

checkpointing:
  # Training checkpoints are triggered by the rolling mean of p(true_sum),
  # not by held-out validation accuracy. These thresholds define the exact
  # anchors used by checkpoint-transfer approximate runs.
  enabled: true
  metric: true_sum_posterior
  posterior_thresholds: [0.2, 0.4, 0.6, 0.8]
  rolling_window_updates: 50
  rolling_window_policy: full

schedule:
  preview_size: 20

checkpoint_transfer:
  # Build green “approx from exact checkpoint” trajectories after normal
  # fixed-budget runs. Exact posterior checkpoints define segment anchors; each
  # approximate segment stops when it reaches the next posterior target or when
  # it has used the same number of sum cases exact needed for that segment.
  enabled: true
  anchor_mode_name: exact
  # Null / omitted means: all non-anchor inference modes.
  mode_names: null
  include_final_checkpoint: true

adaptive_top_k:
  # Adaptive approximate modes tune the generated artifact's mutable TOP_K_CUTOFF
  # so the full posterior keeps about this much unnormalised mass.
  posterior_mass_target: 0.8
  probe_cases: 20
  max_iterations: 14
  tolerance: 0.02
  min_cutoff: 0.0
  max_cutoff: 1.0

visualization:
  trace_smoothing_window_points: 50
  # Across-seed uncertainty shown in milestone error bars and smoothed traces.
  # Options: std, sem, ci95, none. With three seeds, std is the most honest
  # default because it shows run-to-run spread without overclaiming precision.
  uncertainty_interval: std
  min_uncertainty_samples: 2
  show_milestone_error_bars: true
  show_trace_uncertainty_bands: true
  show_raw_trace_uncertainty_bands: false
  trace_band_alpha: 0.16

experiments:
  - n_terms: 2
    enabled: true
    max_steps: 2500

inference_modes:
  - name: exact
    top_k_cutoff: null
  # - name: approx_mass_0p8
  #   top_k_cutoff: auto
  #   adaptive_top_k: true
  #   posterior_mass_target: 0.8
  - name: approx_0p01
    top_k_cutoff: 0.01
  - name: approx_0p05
    top_k_cutoff: 0.05
  - name: approx_0p1
    top_k_cutoff: 0.1

compile:
  count_branches: true
  force_recompile: true
  timeout_sec: 3600
  stack_arch: x86_64
